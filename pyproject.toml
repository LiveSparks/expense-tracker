[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-tracker"
version = "0.1.0"
description = "A simple Python expense tracker CLI."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.9,<1.0",
    "textual>=0.60,<1.0",
    "uvicorn>=0.30,<1.0",
]

[project.scripts]
expense-tracker = "expense_tracker.cli:main"

[tool.setuptools.packages.find]
include = ["expense_tracker*"]

[tool.setuptools.package-data]
expense_tracker = ["templates/*.html", "static/*.css"]
