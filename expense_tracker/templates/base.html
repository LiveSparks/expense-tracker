<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{% block title %}Expense Tracker{% endblock %}</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a href="/" class="brand">Expense Tracker</a>
      <nav class="nav-links">
        <a href="/transactions">Transactions</a>
        <a href="/reviews">Reviews</a>
        <a href="{{ add_transaction_href if add_transaction_href is defined else '/transactions/new' }}" data-add-link>Add</a>
        <a href="/manage">Manage</a>
        {% if request.app.state.config.auth_enabled %}
          <form method="post" action="/auth/logout" class="inline-delete-form">
            <button class="button compact-button" type="submit">Logout</button>
          </form>
        {% endif %}
      </nav>
    </header>
    <main class="page-shell">{% block content %}{% endblock %}</main>
  </body>
</html>
