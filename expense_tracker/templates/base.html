<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{% block title %}Expense Tracker{% endblock %}</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a href="/" class="brand">Expense Tracker</a>
      <div class="topbar-actions">
        <a href="{{ add_transaction_href if add_transaction_href is defined else '/transactions/new' }}" class="button primary compact-button" data-add-link>Add</a>
        <button class="icon-button" type="button" data-sidebar-open aria-label="Open menu">☰</button>
      </div>
    </header>
    <aside class="sidebar-drawer" data-sidebar>
      <div class="sidebar-backdrop" data-sidebar-close></div>
      <nav class="sidebar-panel" aria-label="Main menu">
        <div class="sidebar-head">
          <strong>Menu</strong>
          <button class="icon-button" type="button" data-sidebar-close aria-label="Close menu">×</button>
        </div>
        <a href="/transactions" data-sidebar-close-on-nav>Transactions</a>
        <a href="/reviews" data-sidebar-close-on-nav>Reviews</a>
        <a href="/manage" data-sidebar-close-on-nav>Manage</a>
        {% if request.app.state.config.auth_enabled %}
          <form method="post" action="/auth/logout" class="inline-delete-form">
            <button class="button compact-button" type="submit">Logout</button>
          </form>
        {% endif %}
      </nav>
    </aside>
    <main class="page-shell">{% block content %}{% endblock %}</main>
  </body>
</html>
